[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finmlcv"
version = "0.1.0"
description = "Leakage-proof evaluation utilities for financial machine learning (purged CV, CPCV, DSR)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hossein Tabasi" }]
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
xgboost = ["xgboost>=2.0"]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
  "mypy>=1.8",
  "pandas-stubs",
  "types-PyYAML",
]
full = ["finmlcv[torch,xgboost,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finmlcv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
packages = ["finmlcv"]
